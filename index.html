                    });

            try {
                const rawLocal = localStorage.getItem(STORAGE_KEY_LINKS);
                if (rawLocal) {
                    mergeLinkObject(combined, JSON.parse(rawLocal));
                }
            } catch (e) {}

            try {
                const hash = window.location.hash || '';

                if (match && match[1]) {
                    mergeLinkObject(combined, JSON.parse(decodeURIComponent(match[1])));
                }
            } catch (e) {}

            return combined;

                Object.keys(source.ctrip).forEach(function(k) {
                    const v = String(source.ctrip[k] || '').trim();
                    if (v) target.ctrip[k] = v;
                });
            }
            Object.keys(source).forEach(function(k) {
                if (k !== 'xhs' && k !== 'ctrip' && typeof source[k] === 'string') {
                    const v = source[k].trim();
                    if (v) {
                        if (k.startsWith('hotel-')) target.ctrip[k] = v;
                        else target.xhs[k] = v;
                    }
                }
            });
        }

        function getStoredLink(platform, id) {
            if (platform === 'ctrip') return (linksMap.ctrip && linksMap.ctrip[id]) ? linksMap.ctrip[id] : '';
            return (linksMap.xhs && linksMap.xhs[id]) ? linksMap.xhs[id] : '';
        }

        function persistLinksEverywhere() {
            try {
                localStorage.setItem(STORAGE_KEY_LINKS, JSON.stringify(linksMap));
            } catch (e) {}
            try {
                const encoded = encodeURIComponent(JSON.stringify(linksMap));
                const newHash = '#links=' + encoded;
                if (window.location.hash !== newHash) {
                    history.replaceState(null, '', newHash);
                }
            } catch (e) {}
            updateHeaderStats();
        }

        function extractUrlOrText(rawInput) {
            const trimmed = String(rawInput || '').trim();
            if (!trimmed) return '';
            const urlMatch = trimmed.match(/https?:\/\/[^\s"'<>]+/i);
            if (urlMatch && urlMatch[0]) {
                return urlMatch[0].replace(/[.,;!?]+$/, '');
            }
            return trimmed;
        }

        function saveItemLink(platform, id, inputElId) {
            const inputEl = document.getElementById(inputElId);
            const cleaned = extractUrlOrText(inputEl ? inputEl.value : '');
            if (!cleaned) {
                showToast('請先貼上連結或分享文字');
                return;
            }
            if (platform === 'ctrip') linksMap.ctrip[id] = cleaned;
            else linksMap.xhs[id] = cleaned;

            editingLinkKey = null;
            persistLinksEverywhere();
            renderContent();
            showToast(platform === 'ctrip' ? '✅ 已儲存攜程連結（網址已同步）' : '✅ 已儲存小紅書連結（網址已同步）');
        }

        function startEditLink(platform, id) {
            editingLinkKey = platform + ':' + id;
            renderContent();
            setTimeout(function() {
                const el = document.getElementById('link-input-' + platform + '-' + id);
                if (el) el.focus();
            }, 30);
        }

        function cancelEditLink() {
            editingLinkKey = null;
            renderContent();
        }

        function removeItemLink(platform, id) {
            if (platform === 'ctrip') delete linksMap.ctrip[id];
            else delete linksMap.xhs[id];
            editingLinkKey = null;
            persistLinksEverywhere();
            renderContent();
            showToast('已移除連結');
        }

        function openSavedLink(platform, id, fallbackName) {
            const saved = getStoredLink(platform, id);
            if (saved) {
                const targetUrl = /^https?:\/\//i.test(saved)
                    ? saved
                    : 'https://www.xiaohongshu.com/search_result?keyword=' + encodeURIComponent(saved);
                window.open(targetUrl, '_blank', 'noopener,noreferrer');
                return;
            }
            if (platform === 'xhs') {
                const query = encodeURIComponent(fallbackName + ' 菜色 推薦');
                window.open('https://www.xiaohongshu.com/search_result?keyword=' + query, '_blank', 'noopener,noreferrer');
            }
        }

        function loadWishlist() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_WISHLIST);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return [];
        }

        function toggleWishlist(itemId, title, subtitle) {
            const idx = wishlist.findIndex(function(item) { return item.id === itemId; });
            if (idx >= 0) {
                wishlist.splice(idx, 1);
                showToast('已從心願清單移除');
            } else {
                wishlist.push({ id: itemId, title: title, subtitle: subtitle || '' });
                showToast('❤️ 已加入她的心願清單');
            }
            try {
                localStorage.setItem(STORAGE_KEY_WISHLIST, JSON.stringify(wishlist));
            } catch (e) {}
            updateHeaderStats();
            renderContent();
        }

        function isInWishlist(itemId) {
            return wishlist.some(function(item) { return item.id === itemId; });
        }

        // =========================================================================
        // 4. 介面元件建構器
        // =========================================================================
        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function copyText(text, label) {
            const val = String(text || '');
            if (!val) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).then(function() {
                    showToast('📋 已複製：' + (label || val));
                }).catch(function() {
                    fallbackCopy(val, label);
                });
            } else {
                fallbackCopy(val, label);
            }
        }

        function fallbackCopy(val, label) {
            const ta = document.createElement('textarea');
            ta.value = val;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('📋 已複製：' + (label || val));
            } catch (e) {
                showToast('複製失敗，請手動選取');
            }
            document.body.removeChild(ta);
        }

        function copyShareableUrl() {
            persistLinksEverywhere();
            copyText(window.location.href, '含已存連結的分享網址');
        }

        function copyInitialLinksCode() {
            const formatMap = function(obj) {
                const keys = Object.keys(obj || {});
                return keys.map(function(k, idx) {
                    const v = String(obj[k] || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    const comma = idx < keys.length - 1 ? ',' : '';
                    return "                '" + k + "': '" + v + "'" + comma;
                }).join('\n');
            };
            const code =
                "const INITIAL_LINKS = {\n" +
                "            xhs: {\n" +
                formatMap(linksMap.xhs) + "\n" +
                "            },\n" +
                "            ctrip: {\n" +
                formatMap(linksMap.ctrip) + "\n" +
                "            }\n" +
                "        };";
            copyText(code, 'INITIAL_LINKS 程式碼');
        }

        function showToast(message) {
            const el = document.getElementById('toastBanner');
            if (!el) return;
            el.textContent = message;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function() {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 2000);
        }

        function updateHeaderStats() {
            const wBadge = document.getElementById('wishlistCountBadge');
            const lText = document.getElementById('savedLinkCountText');
            if (wBadge) wBadge.textContent = wishlist.length;
            const xhsCount = Object.keys(linksMap.xhs || {}).filter(function(k) { return Boolean(linksMap.xhs[k]); }).length;
            const ctripCount = Object.keys(linksMap.ctrip || {}).filter(function(k) { return Boolean(linksMap.ctrip[k]); }).length;
            if (lText) lText.textContent = xhsCount + ctripCount;
        }

        // =========================================================================
        // 6. 心願清單彈窗與初始化
        // =========================================================================
        function openWishlistDrawer() {
            const modal = document.getElementById('wishlistModal');
            const container = document.getElementById('wishlistListContainer');
            if (!modal || !container) return;

            if (!wishlist.length) {
                container.innerHTML = '<p class="text-sm text-muted text-center py-6">目前還沒有收藏項目，點擊餐廳或市集旁的「🤍 收藏」即可加入。</p>';
            } else {
                container.innerHTML = wishlist.map(function(item) {
                    return (
                        '<div class="p-3 rounded-xl bg-cream border border-caramel/15 flex items-center justify-between gap-2">' +
                            '<div>' +
                                '<p class="text-sm font-bold text-ink">' + escapeHtml(item.title) + '</p>' +
                                (item.subtitle ? '<p class="text-xs text-muted mt-0.5">' + escapeHtml(item.subtitle) + '</p>' : '') +
                            '</div>' +
                            '<button type="button" onclick="toggleWishlist(\'' + escapeHtml(item.id) + '\', \'' + escapeHtml(item.title) + '\', \'' + escapeHtml(item.subtitle) + '\');openWishlistDrawer();" ' +
                                    'class="text-xs px-2.5 py-1 rounded-lg bg-white text-xhs border border-xhs/30 cursor-pointer shrink-0">移除</button>' +
                        '</div>'
                    );
                }).join('');
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeWishlistDrawer() {
            const modal = document.getElementById('wishlistModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function copyWishlistSummary() {
            if (!wishlist.length) {
                showToast('心願清單目前是空的');
                return;
            }
            const lines = wishlist.map(function(w, idx) {
                return (idx + 1) + '. ' + w.title + (w.subtitle ? '（' + w.subtitle + '）' : '');
            });
            copyText('❤️ 她的雲南心願清單：\n' + lines.join('\n'), '心願清單');
        }

        persistLinksEverywhere();
        updateHeaderStats();
        renderTabs();
        renderContent();
    </script>
